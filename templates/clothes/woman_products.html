    <h1>Женские товары</h1>
    <ul>
        <!-- Цикл вставить тут -->
         {% for i in woman_products %}
        <li>
            <h2>{{ i.title }}</h2>
            <p>
                {% for tag in i.tags.all %}
                {{ tag.name }} {% if not forloop.last %}, {% endif %}
                {% empty %}
                Категорий нет:
                {% endfor %}
            </p>
        </li>
        <hr>
        {% endfor %}
        <!-- Цикл закрыть тут -->
    </ul>
