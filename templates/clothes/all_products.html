    <h1>Все товары</h1>
    <a href="{% url 'woman' %}">Для женщинт</a>
    <a href="{% url 'man' %}">Для мужчин</a>
    <a href="{% url 'teenager' %}">Для подростков</a>
    <a href="{% url 'kid' %}">Для детей</a>
    <a href="{% url 'uni' %}">Uni товары</a>
    <ul>
        <!-- Цикл вставить тут -->
         {% for i in products %}
        <li>
            <h2>{{ i.title }}</h2>
            <p>
                {% for tag in i.tags.all %}
                {{ tag.name }} {% if not forloop.last %}, {% endif %}
                {% empty %}
                Категорий нет:
                {% endfor %}
            </p>
        </li>
        <hr>
        {% endfor %}
        <!-- Цикл закрыть тут -->

    </ul>
